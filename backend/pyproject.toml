[project]
name = "backend"
version = "0.1.0"
description = "Voice Presentation Agent Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.124.0",
    "google-genai>=1.54.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "websockets>=15.0.1",
    "python-pptx>=0.6.23",
    "pydub>=0.25.1",
]

[tool.uv]
dev-dependencies = []

[project.scripts]
dev = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
